name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Python Dependencies
        run: |
          pip install pandas numpy networkx pyyaml matplotlib

      - name: Python Tests
        run: |
          python3 tests/test_importers.py
          python3 tests/test_analytics.py
          # Need to build debug binary for validation suite test
          cargo build --bin morphogenetic-security
          python3 tests/test_validation_suite.py

      - name: Attack Simulation Smoke Test
        run: bash scripts/run_attack_simulation.sh

      - name: Evolution Smoke Test
        run: bash scripts/run_evolution_smoke_test.sh
